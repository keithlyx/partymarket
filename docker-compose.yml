networks:
  my-networks:

volumes:
  rabbitmq_data:
  mysql_data:

services:

  ###############################################
  # MySQL: one local server with one schema per service
  ###############################################
  database:
    image: mysql:8.0
    container_name: partymarket-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    networks:
      - my-networks
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./databases:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  ###############################################
  ####################################
  # RabbitMQ: The messaging broker   
  ####################################
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    container_name: rabbitmq
    restart: always
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes: 
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  #################################
  # Venue: Venue microservice
  #################################
  venue:
    build:
      context: ./microservices/simple/venue
      dockerfile: Dockerfile
    container_name: venue
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5003:5003"
    restart: always
    environment:
      VENUE_DATABASE_URL: "mysql+mysqlconnector://root:${MYSQL_ROOT_PASSWORD}@database:3306/venue"
    depends_on:
      database:
        condition: service_healthy


  ###############################################
  # Catalogue: Catalogue microservice
  ###############################################
  catalogue:
    build:
      context: ./microservices/simple/catalogue
      dockerfile: Dockerfile
    container_name: catalogue
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5004:5004"
    restart: always
    environment:
      CATALOGUE_DATABASE_URL: "mysql+mysqlconnector://root:${MYSQL_ROOT_PASSWORD}@database:3306/catalogue"
    depends_on:
      database:
        condition: service_healthy


  ###############################################
  # Review: Review microservice
  ###############################################
  review:
    build:
      context: ./microservices/simple/review
      dockerfile: Dockerfile
    container_name: review
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5007:5007"
    restart: always
    environment:
      REVIEW_DATABASE_URL: "mysql+mysqlconnector://root:${MYSQL_ROOT_PASSWORD}@database:3306/reviews"
    depends_on:
      database:
        condition: service_healthy


  ###############################################
  # Payment: Payment microservice
  ###############################################
  payment:
    build:
      context: ./microservices/simple/payment
      dockerfile: Dockerfile
    container_name: payment
    environment:
      STRIPE_PUBLIC_KEY: "${STRIPE_PUBLIC_KEY}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5008:5008"
    restart: always


  ###############################################
  # Order: Order microservice
  ###############################################
  order:
    build:
      context: ./microservices/simple/order
      dockerfile: Dockerfile
    container_name: order
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5006:5006"
    restart: always
    environment:
      ORDER_DATABASE_URL: "mysql+mysqlconnector://root:${MYSQL_ROOT_PASSWORD}@database:3306/orders"
    depends_on:
      database:
        condition: service_healthy


  ###############################################
  # Cart: Cart microservice
  ###############################################
  cart:
    build:
      context: ./microservices/simple/cart
      dockerfile: Dockerfile
    container_name: cart
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5005:5005"
    restart: always
    environment:
      CART_DATABASE_URL: "mysql+mysqlconnector://root:${MYSQL_ROOT_PASSWORD}@database:3306/cart"
    depends_on:
      database:
        condition: service_healthy


  ###############################################
  # Email: Email microservice
  ###############################################
  notification:
    build:
      context: ./microservices/simple/emailNode
      dockerfile: Dockerfile
    container_name: notification
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5010:5010"
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SENDGRID_API_KEY: "${SENDGRID_API_KEY}"


  ###############################################
  # Process_Order: Process_Order microservice
  ###############################################
  process_order:
    build:
      context: ./microservices/complex/process_order
      dockerfile: Dockerfile
    container_name: process_order
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5200:5200"
    restart: always
    environment:
      PAYMENT_URL: "http://payment:5008/api/v1/payments"
      CART_URL: "http://cart:5005/api/v1/carts"
      ORDER_URL: "http://order:5006/api/v1/orders"
      CATALOGUE_URL: "http://catalogue:5004/api/v1/catalogue"
      VENUE_URL: "http://venue:5003/api/v1/venues"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      PYTHONUNBUFFERED: 1

    depends_on:
      - venue
      - catalogue
      - cart
      - order
      - payment
      - review
      - notification
      - rabbitmq
  
  ###############################################
  # Process_Review: Process_Review microservice
  ###############################################
  process_review:
    build:
      context: ./microservices/complex/process_review
      dockerfile: Dockerfile
    container_name: process_review
    networks:
      - my-networks
    environment:
      CATALOGUE_URL: "http://catalogue:5004/api/v1/catalogue"
      VENUE_URL: "http://venue:5003/api/v1/venues"
      REVIEW_URL: "http://review:5007/api/v1/reviews"
    ports:
      - "127.0.0.1:5400:5400"
    restart: always
    depends_on:
      - venue
      - catalogue
      - cart
      - order
      - payment
      - review
      - notification
      - rabbitmq

  ###############################################
  # View_Order: View_Order microservice
  ###############################################
  view_order:
    build:
      context: ./microservices/complex/view_order
      dockerfile: Dockerfile
    container_name: view_order
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5300:5300"
    restart: always
    environment:
      CATALOGUE_URL: "http://catalogue:5004/api/v1/catalogue"
      VENUE_URL: "http://venue:5003/api/v1/venues"
      ORDER_URL: "http://order:5006/api/v1/orders"
    depends_on:
      - venue
      - catalogue
      - cart
      - order
      - payment
      - review
      - notification

  ###############################################
  # Process_Refund: Process_Refund microservice
  ###############################################
  
  process_refund:
    build:
      context: ./microservices/complex/process_refund
      dockerfile: Dockerfile
    container_name: process_refund
    networks:
      - my-networks
    ports:
      - "127.0.0.1:5700:5700"
    restart: always
    environment:
      PAYMENT_URL: "http://payment:5008/api/v1/refunds"
      ORDER_URL: "http://order:5006/api/v1/orders"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      - venue
      - catalogue
      - cart
      - order
      - payment
      - review
      - notification
      - rabbitmq
