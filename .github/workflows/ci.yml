name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      CATALOGUE_DATABASE_URL: "sqlite:///:memory:"
      CART_DATABASE_URL: "sqlite:///:memory:"
      ORDER_DATABASE_URL: "sqlite:///:memory:"
      REVIEW_DATABASE_URL: "sqlite:///:memory:"
      VENUE_DATABASE_URL: "sqlite:///:memory:"
      USER_DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check Python syntax
        run: python -m compileall -q main microservices
      - name: Check patch formatting
        run: git diff --check

  notification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/simple/emailNode
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install notification dependencies
        run: npm ci --ignore-scripts
      - name: Run notification tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check src/notification.js && node --check src/notification_validation.js && node --check src/retry_policy.js

  compose:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-only-database-password
      FLASK_SECRET_KEY: ci-only-flask-secret
      STRIPE_PUBLIC_KEY: pk_test_ci_placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      SENDGRID_API_KEY: SG.ci_placeholder
      SENDGRID_FROM_EMAIL: ci@example.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
