<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      #modal-container {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }

      #modal-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>

    <form action="/charge" method="post" id="payment-form">
      <div class="form-row">
        <label for="card-element"> Credit or debit card </label>
        <div id="card-element">
          <!-- A Stripe Element will be inserted here. -->
        </div>

        <!-- Used to display Element errors. -->
        <div id="card-errors" role="alert"></div>
      </div>

      <button id="modal-trigger">Submit Payment</button>

    </form>
    <div id="modal-container">
      <div id="modal-content">
        <h2>Payment Successful!</h2>
        <button id="modal-close">Return</button>
      </div>
    </div>
  <div id="ghettodata" data-email="{{email}}" data-username="{{username}}" hidden></div>
    <script>

        const cart_deets = {{ cart_cookie | tojson }};
        const checkout_deets = {{ checkout_cookie | tojson }};
      const items = [];
      for (const item of cart_deets["catalogue_cart_details"]){
        items.push({
          "item_id":  item[4],
          "item_quantity": item[2],
          "item_price": Number(item[3]),
          "item_name": item[1],
        })
      }
      const venue = [];
        for (const item of cart_deets["venue_cart_details"]){

            venue.push({
            "venue_id":  item[3],
            "venue_datetime": item[4],
            "venue_price": Number(item[2]),
            "venue_name": item[0],
            })
        }
      // See your keys here: https://dashboard.stripe.com/apikeys
      const stripe = Stripe("{{ config['STRIPE_PUBLIC_KEY'] }}");
      const elements = stripe.elements();
      // Custom styling can be passed to options when creating an Element.
      const style = {
        base: {
          // Add your base input styles here. For example:
          fontSize: "16px",
          color: "#32325d",
        },
      };

      // Create an instance of the card Element.
      const card = elements.create("card", { style });

      // Add an instance of the card Element into the `card-element` <div>.
      card.mount("#card-element");
      // Create a token or display an error when the form is submitted.
      const form = document.getElementById("payment-form");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const { token, error } = await stripe.createToken(card);
        if (error) {
          // Inform the customer that there was an error.
          const errorElement = document.getElementById("card-errors");
          errorElement.textContent = error.message;
        } else {

          // Send the token to your server.
          //   stripeTokenHandler(token);
           const result={
          "user_id": document.getElementById("ghettodata").dataset.email,
          "username": document.getElementById("ghettodata").dataset.username,
          "token": token.id,
          "total_amount": Number(cart_deets["total_amount"]),
          "delivery_address": checkout_deets["delivery_address"],
          "delivery_datetime": checkout_deets["delivery_date"],
            //rememeber to change this to the datatime instead of date
          "items": items,
           }
           if (venue.length > 0) {
             result.venue = venue[0];
           }

           let response;
           try {
             response = await axios.post({{ process_order_url|tojson }} + "/api/v1/orders", result);
           } catch (error) {
             document.getElementById("card-errors").textContent = "The order could not be created. Please try again.";
             return;
           }

           if (response.data.code == 201){
             const modalContainer = document.getElementById('modal-container');
             const modalClose = document.getElementById('modal-close');
            modalContainer.style.display = 'block';

             // Close modal when close button is clicked
             modalClose.addEventListener('click', () => {
               window.location.href = '/order-logs/' + response.data.order_id;
             });
           } else {
             document.getElementById("card-errors").textContent = response.data.message || "The order could not be created.";
           }
        }
      });

    </script>
  </body>
</html>
